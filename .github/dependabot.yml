# Dependabot — monthly, grouped: at most one pull request per ecosystem.
# Without it, pinned actions and dependencies age without anyone noticing.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # The requirements here are ranges (>=). By default Dependabot raises every
    # lower bound to the latest release, which rewrites "the oldest version this
    # project supports" into "the newest one published". With this strategy a
    # requirement is left alone while it already allows the new release, and is
    # only changed when it excludes it (an exact pin, or an upper bound).
    versioning-strategy: increase-if-necessary
    groups:
      python:
        patterns: ["*"]
